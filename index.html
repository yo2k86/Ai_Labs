<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f78c3b; /* Warna latar belakang oranye seperti di gambar */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 600px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-404 {
            position: absolute;
            font-size: 300px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.1); /* Warna transparan untuk teks di latar belakang */
            z-index: 0;
            letter-spacing: -20px;
            user-select: none;
        }

        .characters {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 40px; /* Jarak antara dua karakter */
        }

        .character {
            position: relative;
        }

        .body {
            width: 100px;
            height: 120px;
            background-color: #c93a40; /* Merah */
            border-radius: 50% 50% 40% 40%;
            position: relative;
            z-index: 2;
        }

        .mask {
            width: 70px;
            height: 90px;
            background-color: #1a2930; /* Hitam kebiruan */
            border-radius: 35px;
            position: absolute;
            top: -30px;
            left: 15px;
            z-index: 3;
        }

        .eye {
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 30px;
        }

        .eye.left { left: 15px; }
        .eye.right { right: 15px; }

        .nose {
            width: 15px;
            height: 8px;
            background-color: #eab08c; /* Warna kulit */
            border-radius: 10px;
            position: absolute;
            top: 40px;
            left: 27.5px;
        }

        .arm {
            position: absolute;
            background-color: #eab08c; /* Warna kulit */
            width: 35px;
            border-radius: 20px;
            z-index: 1;
            transform-origin: top center;
        }

        .char-left .arm-left {
            height: 100px;
            top: 30px;
            left: -15px;
            transform: rotate(30deg);
            animation: swingLeft 2s ease-in-out infinite alternate;
        }

        .char-left .arm-right {
            height: 100px;
            top: 30px;
            right: -15px;
            transform: rotate(-10deg);
        }

        .char-right .arm-left {
            height: 100px;
            top: 30px;
            left: -15px;
            transform: rotate(10deg);
        }

        .char-right .arm-right {
            height: 100px;
            top: 30px;
            right: -15px;
            transform: rotate(-80deg);
            animation: swingRight 2s ease-in-out infinite alternate;
        }

        .bat {
            position: absolute;
            width: 15px;
            height: 80px;
            background-color: #5d1b1b; /* Coklat tua */
            border-radius: 10px;
        }

        .char-left .bat {
            bottom: -60px;
            left: 5px;
            transform: rotate(-30deg);
        }

        .char-right .bat {
            bottom: -60px;
            left: 10px;
            transform: rotate(10deg);
        }

        .leg {
            position: absolute;
            background-color: #eab08c; /* Warna kulit */
            width: 20px;
            height: 40px;
            bottom: -30px;
            z-index: 1;
        }

        .leg.left { left: 20px; border-radius: 10px 10px 0 0; }
        .leg.right { right: 20px; border-radius: 10px 10px 0 0; }

        .shoe {
            position: absolute;
            background-color: #c93a40; /* Merah sama dengan tubuh */
            width: 30px;
            height: 15px;
            border-radius: 15px 15px 5px 5px;
            bottom: -10px;
            left: -5px;
        }
        
        .shadow {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 0;
            animation: shadowScale 2s ease-in-out infinite alternate;
        }

        /* Lengan yang Diam (Lengan Luar) */
        .char-left .arm-left {
            height: 90px;
            top: 40px;
            left: -10px;
            transform: rotate(10deg);
            z-index: 1;
        }

        .char-right .arm-right {
            height: 90px;
            top: 40px;
            right: -10px;
            transform: rotate(-10deg);
            z-index: 1;
        }

        /* Lengan yang Memukul (Lengan Dalam yang berhadapan) */
        .char-left .arm-right {
            height: 80px;
            top: 40px;
            right: -10px;
            transform-origin: 17.5px 15px; /* Titik putar di bahu */
            z-index: 10; /* Lengan di depan tubuh lawan */
            animation: leftSwing 3s infinite;
        }

        .char-right .arm-left {
            height: 80px;
            top: 40px;
            left: -10px;
            transform-origin: 17.5px 15px; /* Titik putar di bahu */
            z-index: 10; /* Lengan di depan tubuh lawan */
            animation: rightSwing 3s infinite;
        }

        .bat {
            position: absolute;
            width: 15px;
            height: 90px;
            background-color: #5d1b1b;
            border-radius: 10px;
            bottom: -70px;
        }

        .char-left .arm-right .bat {
            left: 10px;
            transform: rotate(-20deg);
        }

        .char-right .arm-left .bat {
            right: 10px;
            transform: rotate(20deg);
        }

        .char-left {
            animation: leftBodyFlinch 3s infinite;
        }
        
        .char-right {
             animation: rightBodyFlinch 3s infinite;
        }

        .char-left .mask {
            animation: leftHeadOuch 3s infinite;
        }

        .char-right .mask {
            animation: rightHeadOuch 3s infinite;
        }

        /* Giliran Kanan Memukul Kiri (Putaran 360 Derajat Penuh) */
        @keyframes rightSwing {
            0%, 10% { transform: rotate(0deg); }
            15% { transform: rotate(-45deg); } /* Tarik ancang-ancang ke belakang */
            20% { transform: rotate(110deg); } /* BAAAM! Kena kepala (Laju sangat cepat) */
            35% { transform: rotate(360deg); } /* Lanjutkan putaran hingga 360 derajat */
            35.1%, 100% { transform: rotate(0deg); } /* Transisi instan untuk reset */
        }

        /* Giliran Kiri Memukul Kanan (Putaran 360 Derajat Penuh) */
        @keyframes leftSwing {
            0%, 60% { transform: rotate(0deg); }
            65% { transform: rotate(45deg); } /* Tarik ancang-ancang ke belakang */
            70% { transform: rotate(-110deg); } /* BAAAM! Kena kepala (Laju sangat cepat) */
            85% { transform: rotate(-360deg); } /* Lanjutkan putaran hingga 360 derajat */
            85.1%, 100% { transform: rotate(0deg); } /* Transisi instan untuk reset */
        }

        /* Reaksi Karakter Kiri saat dipukul */
        @keyframes leftHeadOuch {
            0%, 18%, 35%, 100% { transform: rotate(0deg) translate(0, 0); }
            20% { transform: rotate(-35deg) translate(-15px, 15px); } /* Kepala tertunduk kesakitan */
        }

        @keyframes leftBodyFlinch {
            0%, 18%, 35%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-15px) rotate(-5deg); } /* Tubuh terdorong */
        }

        /* Reaksi Karakter Kanan saat dipukul */
        @keyframes rightHeadOuch {
            0%, 68%, 85%, 100% { transform: rotate(0deg) translate(0, 0); }
            70% { transform: rotate(35deg) translate(15px, 15px); } /* Kepala tertunduk kesakitan */
        }

        @keyframes rightBodyFlinch {
            0%, 68%, 85%, 100% { transform: translateX(0) rotate(0deg); }
            70% { transform: translateX(15px) rotate(5deg); } /* Tubuh terdorong */
        }

        @keyframes shadowScale {
            0% { transform: translateX(-50%) scale(0.9); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        #audio-toggle {
            position: absolute;
            top: 30px;
            right: 30px;
            padding: 12px 24px;
            background-color: #1a2930;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        #audio-toggle:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button id="audio-toggle">🔇 Aktifkan Suara</button>

    <div class="container">
        <!-- Teks 404 di latar belakang -->
        <div class="text-404">404</div>

        <div class="characters">
            <!-- Karakter Kiri -->
            <div class="character char-left">
                <div class="shadow"></div>
                <div class="mask">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                </div>
                <div class="arm arm-left"></div>
                <div class="arm arm-right">
                    <div class="bat"></div>
                </div>
                <div class="body"></div>
                <div class="leg left"><div class="shoe"></div></div>
                <div class="leg right"><div class="shoe"></div></div>
            </div>

            <!-- Karakter Kanan -->
            <div class="character char-right">
                <div class="shadow"></div>
                <div class="mask">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                </div>
                <div class="arm arm-left">
                    <div class="bat"></div>
                </div>
                <div class="arm arm-right"></div>
                <div class="body"></div>
                <div class="leg left"><div class="shoe"></div></div>
                <div class="leg right"><div class="shoe"></div></div>
            </div>
        </div>
    </div>

    <script>
        const audioBtn = document.getElementById('audio-toggle');
        let isPlaying = false;
        let loop;

        audioBtn.addEventListener('click', async () => {
            if (!isPlaying) {
                // Meminta izin browser untuk memulai Audio Context
                await Tone.start();
                isPlaying = true;
                audioBtn.innerText = "🔊 Suara Nyala";
                audioBtn.style.backgroundColor = "#c93a40"; // Merah seperti tubuhnya
                
                // Kita perlu me-restart animasi agar sinkron sempurna dengan siklus suara (3 detik)
                const animatedElements = document.querySelectorAll('.char-left, .char-right, .char-left .mask, .char-right .mask, .char-left .arm-right, .char-right .arm-left');
                animatedElements.forEach(el => el.style.animation = 'none');
                void document.body.offsetHeight; // Memaksa browser untuk merender ulang secara instan (reflow)
                animatedElements.forEach(el => el.style.animation = '');
                
                // Suara "Bonk" untuk pukulan kepala (Membrane Synth menciptakan suara seperti drum/ketukan)
                const bonkSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.1,
                    octaves: 3,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
                }).toDestination();

                // Suara "Wush" untuk ayunan tongkat (Noise Synth menciptakan suara desisan angin)
                const whooshSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                whooshSynth.volume.value = -12; // Kecilkan sedikit volume suara anginnya

                Tone.Transport.stop();
                Tone.Transport.cancel();

                // Loop sepanjang 3 detik, persis sama dengan durasi animasi CSS kita
                loop = new Tone.Loop((time) => {
                    // Karakter Kanan memukul (Titik puncak (BAAAM) animasi CSS ada di 20% dari 3 detik = 0.6 detik)
                    whooshSynth.triggerAttackRelease("16n", time + 0.35); // Angin berayun duluan
                    bonkSynth.triggerAttackRelease("G2", "8n", time + 0.6); // Suara pantulan kepala (Pitch G2)

                    // Karakter Kiri memukul (Titik puncak (BAAAM) animasi CSS ada di 70% dari 3 detik = 2.1 detik)
                    whooshSynth.triggerAttackRelease("16n", time + 1.85); // Angin berayun
                    bonkSynth.triggerAttackRelease("C2", "8n", time + 2.1); // Suara pantulan kepala (Pitch C2, beda nada)
                }, 3).start(0);

                Tone.Transport.start();
            } else {
                // Matikan Suara jika tombol diklik lagi
                isPlaying = false;
                audioBtn.innerText = "🔇 Aktifkan Suara";
                audioBtn.style.backgroundColor = "#1a2930";
                Tone.Transport.stop();
            }
        });
    </script>
</body>
</html>
