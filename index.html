<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ailabs Glass Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            min-height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(10, 10, 15, 0.75), rgba(10, 10, 15, 0.75)), url("https://i.ibb.co.com/FLfrC2X8/logo.jpg") center/cover no-repeat fixed;
            z-index: -2;
        }

        .hidden { display: none !important; }

        /* --- LOGIN VIEW --- */
        #login-view {
            width: 90%; max-width: 400px; padding: 40px; border-radius: 32px;
            max-height: 90dvh; overflow-y: auto;
            background: rgba(10, 10, 15, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 107, 125, 0.25); box-shadow: 0 25px 60px rgba(0,0,0,.7); text-align: center; z-index: 10;
        }
        #login-view img { width: 90px; height: 90px; border-radius: 25px; object-fit: cover; margin-bottom: 20px; border: 2px solid rgba(255, 107, 125, 0.4); box-shadow: 0 10px 25px rgba(255, 107, 125, 0.2); }
        #login-view h2 { color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 5px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        #login-view p.subtitle { color: rgba(255, 255, 255, 0.6); font-size: 12px; margin-bottom: 30px; letter-spacing: 1px; }
        
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); font-size: 16px; }
        .input-group input { width: 100%; padding: 15px 15px 15px 45px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #ff6b7d; background: rgba(0, 0, 0, 0.5); box-shadow: inset 0 0 10px rgba(255, 107, 125, 0.1); }
        
        #login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff6b7d, #ff3333); color: #fff; border: none; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(255, 51, 51, 0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        #login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 51, 51, 0.5); }
        #login-error-msg { color: #ff6b7d; font-size: 12px; margin-top: 15px; font-weight: 500; background: rgba(255, 107, 125, 0.1); padding: 10px; border-radius: 10px; }

        /* --- WRAPPER & GLASS PANELS --- */
        .wrapper { display: flex; align-items: flex-start; justify-content: center; transition: .6s ease; opacity: 0; visibility: hidden; width: 100%; max-width: 1200px; height: 90vh; max-height: 850px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .wrapper.open { opacity: 1; visibility: visible; animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        .sidebar, .panel, .sub-panel {
            position: relative; background: rgba(10, 10, 15, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 107, 125, 0.25); box-shadow: 0 25px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05); border-radius: 32px;
        }
        .sidebar::before, .panel::before, .sub-panel::before {
            content: ""; position: absolute; width: 220px; height: 120%; left: -120px; top: -20%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent); transform: rotate(18deg); pointer-events: none;
        }

        /* --- SIDEBAR --- */
        .sidebar { width: 95px; height: 100%; border-radius: 25px; display: flex; flex-direction: column; align-items: center; padding: 28px 0; z-index: 2; }
        .window-btns { display: flex; gap: 10px; margin-bottom: 30px; }
        .window-btns span { width: 12px; height: 12px; border-radius: 50%; }
        .green { background: #2cf95f; color: #2cf95f; } .red { background: #ff6b7d; color: #ff6b7d; } .yellow { background: #ffd93d; color: #ffd93d; }
        
        .logo { width: 62px; height: 62px; display: grid; place-items: center; margin-bottom: 35px; }
        .logo button { width: 58px; height: 58px; border: none; outline: none; border-radius: 18px; cursor: pointer; background: rgba(255,255,255,.06); color: #fff; transition: .35s; }
        .logo button:hover { transform: translateY(-4px); background: rgba(255,255,255,.12); box-shadow: 0 0 15px rgba(255,107,125,0.4); }
        .line { width: 48px; height: 1px; background: rgba(255,255,255,.12); margin: 18px 0; }
        
        .mini-menu { list-style: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .mini-menu li { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,.72); font-size: 22px; border-radius: 18px; cursor: pointer; transition: .35s; position: relative; }
        .mini-menu li:hover { background: rgba(255,255,255,.08); color: #fff; transform: translateY(-3px); }
        .mini-menu li.active { background: rgba(255,255,255,.10); color: #fff; box-shadow: inset 0 1px rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.4); }
        .mini-menu li.active::before { content: ""; position: absolute; left: -18px; width: 5px; height: 34px; border-radius: 20px; background: #ff6b7d; box-shadow: 0 0 12px rgba(255, 107, 125, 0.9); }
        
        .profile { margin-top: auto; margin-bottom: 10px; cursor: pointer; }
        .profile img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.18); transition: .35s; }
        .profile img:hover { border-color: #ff6b7d; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,107,125,0.4); }

        /* --- PANEL 1 (CATEGORIES) --- */
        .panel { width: 420px; height: 100%; padding: 28px; margin-left: 25px; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
        .panel::-webkit-scrollbar, .sub-panel::-webkit-scrollbar { display: none; }
        .panel h1 { color: #fff; font-size: 32px; line-height: 1.2; margin-bottom: 10px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        
        .account { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 16px; margin-top: 5px; margin-bottom: 25px; border-radius: 20px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 107, 125, 0.2); transition: .35s; }
        .account img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 129, 129, 0.5); }
        .account h3 { color: #fff; font-size: 15px; font-weight: 600; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        .account small { color: rgba(255,255,255,.7); font-size: 11px; display: block; }
        .account .actions { margin-left: auto; display: flex; gap: 8px; }
        .account .actions i { color: rgba(255, 107, 125, 0.8); font-size: 16px; padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer; }
        .account .actions i:hover { background: rgba(255, 107, 125, 0.3); color: #fff; transform: scale(1.1); }

        .menu-title { color: rgba(255,255,255,.6); letter-spacing: 2px; font-size: 13px; font-weight: 500; display: block; margin-bottom: 10px; padding: 0 8px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .menu { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .menu li { height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; border-radius: 18px; color: rgba(255,255,255,.78); cursor: pointer; transition: .35s; position: relative; background: rgba(255,255,255,.03); border: 1px solid transparent; }
        .menu li>div { display: flex; align-items: center; gap: 15px; }
        .menu li i { font-size: 18px; }
        .menu li span { font-size: 15px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .menu li:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); color: #fff; transform: translateX(4px); }
        .menu li.current { background: linear-gradient(90deg, rgba(255, 107, 125, 0.25), transparent); color: #fff; border-left: 4px solid #ff6b7d; border-top: 1px solid rgba(255, 107, 125, 0.1); border-bottom: 1px solid rgba(255, 107, 125, 0.1); }
        .menu-badge { background: rgba(255, 255, 255, 0.1); font-size: 11px; padding: 2px 8px; border-radius: 12px; color: #fff; }
        .menu li.current .menu-badge { background: #ff6b7d; }

        /* --- STREAMING_CHUNK: Sub-panel styles --- */
        .sub-panel-wrapper { width: 0; height: 100%; opacity: 0; visibility: hidden; overflow: hidden; transition: width .5s cubic-bezier(.22,1,.36,1), margin-left .5s, opacity .4s; }
        .sub-panel-wrapper.active { width: 420px; margin-left: 25px; opacity: 1; visibility: visible; }
        .sub-panel { width: 420px; height: 100%; padding: 28px; overflow-y: auto; }
        .flex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .flex-header h2 { color: #fff; font-size: 24px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        
        .header-actions { display: flex; gap: 8px; }
        .btn-action { background: rgba(255,107,125,0.15); border: 1px solid rgba(255,107,125,0.3); color: #ff6b7d; width: 34px; height: 34px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: grid; place-items: center; }
        .btn-action:hover { background: #ff6b7d; color: #fff; transform: scale(1.1); box-shadow: 0 5px 15px rgba(255,107,125,0.4); }
        .divider { width: 100%; height: 1px; background: rgba(255,255,255,.12); margin-bottom: 22px; margin-top: 8px; }

        .app-list { display: flex; flex-direction: column; gap: 12px; }
        .app-item { display: flex; align-items: center; gap: 15px; padding: 14px 16px; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 18px; text-decoration: none; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .app-item:hover { background: rgba(255, 107, 125, 0.15); border-color: rgba(255, 107, 125, 0.3); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .app-item::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: #ff6b7d; transform: scaleY(0); transition: 0.3s; border-radius: 4px 0 0 4px; }
        .app-item:hover::before { transform: scaleY(1); }
        
        .app-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, rgba(255,107,125,0.4), rgba(255,51,51,0.1)); border: 1px solid rgba(255, 107, 125, 0.2); display: grid; place-items: center; color: #fff; font-size: 18px; flex-shrink: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.5); overflow: hidden; }
        .app-item:hover .app-icon { background: linear-gradient(135deg, rgba(255,107,125,0.8), rgba(255,51,51,0.4)); }
        
        .app-details { flex-grow: 1; }
        .app-details h4 { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
        .app-details p { color: rgba(255, 255, 255, 0.6); font-size: 11px; line-height: 1.4; }
        
        /* Admin controls inside app item */
        .admin-controls { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; opacity: 0; transition: 0.3s; z-index: 10; }
        .app-item:hover .admin-controls { opacity: 1; }
        .admin-btn { width: 28px; height: 28px; border-radius: 8px; border: none; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: 12px; transition: 0.3s; }
        .btn-edit { background: rgba(255,255,255,0.15); }
        .btn-edit:hover { background: rgba(255,255,255,0.3); }
        .btn-delete { background: rgba(255, 107, 125, 0.5); }
        .btn-delete:hover { background: #ff6b7d; }

        .link-icon { color: rgba(255,255,255,0.2); font-size: 14px; transition: 0.3s; }
        .app-item:hover .link-icon { color: #ff6b7d; transform: translate(2px, -2px); }

        #admin-bulk-btn { margin-left: 8px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: rgba(20, 20, 25, 0.85); border: 1px solid rgba(255, 107, 125, 0.3); border-radius: 24px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); transition: 0.4s; position: relative; }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .modal-icon-top { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #ff6b7d, #ff3333); display: grid; place-items: center; font-size: 24px; color: white; margin: -60px auto 20px auto; box-shadow: 0 10px 20px rgba(255, 107, 125, 0.4); border: 4px solid rgba(20, 20, 25, 1); }
        .modal-box h3 { color: #fff; margin-bottom: 20px; font-weight: 600; text-align: center; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; color: rgba(255,255,255,0.7); font-size: 11px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-family: 'Poppins'; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #ff6b7d; box-shadow: inset 0 0 10px rgba(255, 107, 125, 0.1); }
        .form-group select option { background: #1a1a1a; color: white; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 12px; color: #fff; cursor: pointer; transition: 0.3s; font-family: 'Poppins'; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-save { flex: 1; padding: 12px; background: linear-gradient(135deg, #ff6b7d, #ff3333); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,107,125,0.4); font-family: 'Poppins'; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,107,125,0.6); }

        #bulk-textarea { width: 100%; height: 150px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; padding: 12px; font-family: monospace; font-size: 11px; outline: none; resize: vertical; margin-bottom: 10px; }
        #bulk-textarea:focus { border-color: #ffd93d; box-shadow: inset 0 0 10px rgba(255, 217, 61, 0.1); }
        #bulk-status { font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }
        .text-success { color: #2cf95f; }
        .text-error { color: #ff6b7d; }
        .btn-warning { background: linear-gradient(135deg, #ffd93d, #ffa000); color: #000; box-shadow: 0 5px 15px rgba(255, 217, 61, 0.3); }
        .btn-warning:hover { box-shadow: 0 10px 25px rgba(255, 217, 61, 0.5); }

        /* Responsive */
        @media(max-width:980px){
            .wrapper { gap: 20px; width: 95%; }
            .panel, .sub-panel-wrapper.active, .sub-panel { width: 340px; }
            .panel, .sub-panel-wrapper.active { margin-left: 15px; }
        }
        @media(max-width:760px){
            .wrapper { 
                flex-direction: column; height: 100dvh; max-height: 100dvh; width: 100%; 
                padding: 10px; position: fixed; top: 0; left: 0; transform: none; inset: 0; gap: 10px; 
            }
            .sidebar { 
                width: 100%; height: 75px; padding: 0 15px; border-radius: 20px; 
                flex-direction: row; justify-content: space-between; align-items: center; 
            }
            .sidebar .window-btns, .sidebar .line { display: none; }
            .sidebar .logo { margin-bottom: 0; width: 45px; height: 45px; }
            .sidebar .logo button { width: 45px; height: 45px; border-radius: 12px; }
            .mini-menu { flex-direction: row; justify-content: center; width: auto; gap: 15px; margin: 0; }
            .mini-menu li { width: 45px; height: 45px; font-size: 20px; }
            .mini-menu li.active::before { width: 25px; height: 4px; left: 50%; top: auto; bottom: -8px; transform: translateX(-50%); }
            
            .profile { margin: 0; }
            .profile img { width: 45px; height: 45px; }
            
            .panel { width: 100%; height: calc(100% - 85px); margin-left: 0; flex-grow: 1; padding: 20px; }
            .panel h1 { font-size: 24px; margin-bottom: 15px; }
            .account { padding: 12px; gap: 12px; flex-direction: column; text-align: center; }
            .account .actions { margin: 0 auto; }
            
            .sub-panel-wrapper { 
                position: fixed; top: 85px; left: 10px; right: 10px; bottom: 10px; 
                height: calc(100% - 95px); z-index: 10; 
            }
            .sub-panel-wrapper.active { width: calc(100% - 20px); margin-left: 0; }
            .sub-panel { width: 100%; padding: 20px; }
            .flex-header h2 { font-size: 20px; }

            /* Ensure modals fit the mobile screen and scroll correctly */
            .modal-box { padding: 25px 20px; max-height: 90dvh; overflow-y: auto; }
            .modal-icon-top { width: 50px; height: 50px; margin: -50px auto 15px auto; font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- PORTAL LOGIN -->
    <div id="login-view">
        <img src="https://i.ibb.co.com/FLfrC2X8/logo.jpg" alt="Ailabs Logo" onerror="this.src='https://placehold.co/100x100/ff6b7d/white?text=A'">
        <h2>Ailabs Portal</h2>
        <p class="subtitle">System Secure Login Required</p>
        
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" placeholder="email@gmail.com" onkeypress="if(event.key === 'Enter') processLogin()">
        </div>
        
        <button id="login-btn" onclick="processLogin()">
            <i class="fa-solid fa-fingerprint"></i> Authenticate
        </button>
        
        <p id="login-error-msg" class="hidden"></p>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="wrapper" id="main-app">

        <!-- COLLAPSED SIDEBAR -->
        <aside class="sidebar">
            <div class="window-btns">
                <span class="green"></span>
                <span class="red"></span>
                <span class="yellow"></span>
            </div>

            <div class="logo">
                <button id="toggle" title="Toggle Panel" onclick="handleLogoClick()">
                    <img src="https://i.ibb.co.com/FLfrC2X8/logo.jpg" alt="Ailabs Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 18px;" onerror="this.src='https://placehold.co/100x100/ff6b7d/white?text=A'">
                </button>
            </div>

            <div class="line"></div>

            <ul class="mini-menu">
                <!-- Kategori akan dirender secara otomatis dari database via JS -->
            </ul>

            <div class="profile" onclick="handleLogoClick()" title="Klik 3x untuk Admin Mode">
                <img src="https://i.ibb.co.com/FLfrC2X8/logo.jpg" alt="Profile" id="sidebar-profile-img" onerror="this.src='https://placehold.co/100x100/333/white?text=U'">
            </div>
        </aside>

        <!-- PANEL KATEGORI -->
        <section class="panel">
            <h1>Ailabs Workspace</h1>
            
            <div class="account">
                <img src="https://i.ibb.co.com/FLfrC2X8/logo.jpg" alt="Account Avatar" id="panel-profile-img" onerror="this.src='https://placehold.co/100x100/333/white?text=U'">
                <div>
                    <h3 id="user-name-display">Loading...</h3>
                    <small id="user-email-display">...</small>
                </div>
                <div class="actions">
                    <i id="sync-btn" class="fa-solid fa-rotate" title="Sync Data Cloud" onclick="forceSync()"></i>
                    <i class="fa-solid fa-right-from-bracket" title="Logout" onclick="handleLogout()"></i>
                </div>
            </div>

            <span class="menu-title">KATEGORI</span>

            <ul class="menu" id="category-menu">
                <!-- Kategori akan dirender secara otomatis dari database via JS -->
            </ul>
        </section>

        <!-- SUB-PANEL WADAH DAFTAR APLIKASI -->
        <div class="sub-panel-wrapper" id="sub-panel-wrapper">
            <section class="panel sub-panel">
                <div class="flex-header">
                    <h2 id="sub-panel-title">Applications</h2>
                    <div class="header-actions">
                        <button id="admin-bulk-btn" class="btn-action hidden" onclick="openBulkModal()" title="Bulk Import Data" style="color: #ffd93d; background: rgba(255, 217, 61, 0.15); border-color: rgba(255, 217, 61, 0.3);"><i class="fa-solid fa-file-import"></i></button>
                        <button id="admin-add-btn" class="btn-action hidden" onclick="openAddModal()" title="Tambah Aplikasi"><i class="fa-solid fa-plus"></i></button>
                        <button class="btn-action" onclick="closeSubPanel()" title="Tutup Panel"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="divider" style="margin-top: 0;"></div>
                
                <div id="app-list" class="app-list">
                    <!-- Aplikasi dirender di sini lewat JS -->
                </div>
            </section>
        </div>
    </div>

    <!-- MODAL PASSWORD ADMIN -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon-top"><i class="fa-solid fa-user-shield"></i></div>
            <h3>Admin Protocol</h3>
            
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="Enter System Code..." onkeypress="if(event.key === 'Enter') verifyPassword()" style="text-align: center; letter-spacing: 2px;">
            </div>

    <script>
        // Endpoint Google Script
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgYCCYXKE1RPLdUCeq3Lv7rqGaOPkl19P9LmsiXDFuAWNpgtlHI2-NWoJ85v10QuDVOw/exec";
        
        // PENTING BROW: Ganti link di bawah ini dengan URL DEPLOY YANG BARU dari Google Script!
        const APPS_DB_URL = "https://script.google.com/macros/s/AKfycbzRxycito28jUjQeCHIMEEfHtOFa6LGBtReLv01WX2-mFbrq1MfO0QWXYCoF0l1dYBgsA/exec"; 
        
        let isAdmin = false;
        let clickCount = 0;
        let clickTimer;
        let currentCategory = 'apps';
        
        // KONFIGURASI KATEGORI DASAR (Otomatis Handle Kategori Baru)
        const categoryConfig = {
            'apps': { title: 'Applications', icon: 'fa-layer-group' },
            'xpro': { title: 'X-Pro Edition', icon: 'fa-fire' },
            'toolkit': { title: 'Toolkit', icon: 'fa-wrench' },
            'guides': { title: 'Guides & Tutorials', icon: 'fa-book-open' }
        };

        // TAMBAHKAN BARIS INI: Atur urutan kategori sesuka Anda di sini
        const CATEGORY_ORDER = ['apps', 'xpro', 'toolkit', 'guides'];

        function getCategoryInfo(catKey) {
            if(categoryConfig[catKey]) return categoryConfig[catKey];
            // Jika ada kategori baru dari spreadsheet, rapikan teks dan beri ikon default folder
            let title = catKey.split(/[-_ ]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return { title: title, icon: 'fa-folder-open' };
        }
        
        // DAFTAR 27 APLIKASI PERMANEN
        const DEFAULT_APPS = [
            { id: "app_1", name: "AIlabs Voice Over V2", url: "https://gemini.google.com/share/8d40127f7175", category: "apps", logo: "" },
            { id: "app_2", name: "Ailabs UMKM", url: "https://gemini.google.com/share/49a52a6c4734", category: "apps", logo: "" },
            { id: "app_3", name: "Ailabs Affiliate", url: "https://gemini.google.com/share/3cee1998a001", category: "apps", logo: "" },
            { id: "app_4", name: "Ailabs Cartoon", url: "https://gemini.google.com/share/af5518ea9706", category: "apps", logo: "" },
            { id: "app_5", name: "Restore Image", url: "https://gemini.google.com/share/c979a3417d29", category: "apps", logo: "" },
            { id: "app_6", name: "Auto Caption", url: "https://gemini.google.com/share/a994fe709148", category: "apps", logo: "" },
            { id: "app_7", name: "Reels Analizer", url: "https://gemini.google.com/share/ce867c6a8c17", category: "apps", logo: "" },
            { id: "app_8", name: "Ailabs Flux", url: "https://gemini.google.com/share/cb7e1012f4f9", category: "apps", logo: "" },
            { id: "app_9", name: "Ailabs Ramadhan", url: "https://gemini.google.com/share/fa5bd00de5dd", category: "apps", logo: "" },
            { id: "app_10", name: "Morp", url: "https://gemini.google.com/share/adcc08ee9a8f", category: "apps", logo: "" },
            { id: "app_11", name: "Template", url: "https://gemini.google.com/share/58c58ead3699", category: "apps", logo: "" },
            { id: "app_12", name: "DNA", url: "https://gemini.google.com/share/94a493208c91", category: "apps", logo: "" },
            { id: "app_13", name: "DNA PRO", url: "https://gemini.google.com/share/dff84aeea426", category: "xpro", logo: "" },
            { id: "app_14", name: "Ailabs Storyboard Pro", url: "https://gemini.google.com/share/2f70a3ba09cb", category: "xpro", logo: "" },
            { id: "app_15", name: "Ailabs Scene Pro", url: "https://gemini.google.com/share/061581303ba4", category: "xpro", logo: "" },
            { id: "app_16", name: "Ailabs Storyboard Pro V2", url: "https://gemini.google.com/share/e3ac8279c8cf", category: "xpro", logo: "" },
            { id: "app_17", name: "Manipulasi Audio", url: "https://audio-modifier.vercel.app/", category: "toolkit", logo: "" },
            { id: "app_18", name: "Ailabs Capcut", url: "https://ailabs-cc.vercel.app/", category: "toolkit", logo: "" },
            { id: "app_19", name: "EncodeBase64", url: "https://gemini.google.com/share/520c6663d2a0", category: "toolkit", logo: "" },
            { id: "app_20", name: "WM Remover", url: "https://gemini.google.com/share/01704ae5fbbf", category: "toolkit", logo: "" },
            { id: "app_21", name: "Music Mastering", url: "https://masteraudio.pro", category: "toolkit", logo: "" },
            { id: "app_22", name: "Suno Style", url: "https://gemini.google.com/share/6a3f36032542", "category": "toolkit", logo: "" },
            { id: "app_23", name: "Upscale Image", url: "https://upscale-image.vercel.app/", category: "toolkit", logo: "" },
            { id: "app_24", name: "Ailabs Speed", url: "https://ailabs-speed.vercel.app/", category: "toolkit", logo: "" },
            { id: "app_25", name: "Media Forge", "url": "https://gemini.google.com/share/a8f284a49e0d", "category": "toolkit", logo: "" },
            { id: "app_26", name: "Desain Cover AI", "url": "https://gemini.google.com/share/b6ce96b95d5a", "category": "guides", logo: "" },
            { id: "app_27", name: "42 Camera Movements", "url": "https://aishotstudio.com/42-camera-movements-ai-prompts/", "category": "guides", logo: "" }
        ];

        let allApps = [...DEFAULT_APPS];

        // Inisialisasi Auth
        function initAuth() {
            const savedUser = sessionStorage.getItem('ailabsSession');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                showMainApp(user);
            } else {
                document.getElementById('login-view').classList.remove('hidden');
            }
        }

        async function processLogin() {
            const emailInput = document.getElementById('login-email').value.trim();
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error-msg');

            if (!emailInput) {
                errorMsg.textContent = "Harap masukkan Gmail terlebih dahulu!";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`${GAS_URL}?email=${encodeURIComponent(emailInput)}`);
                const responseText = await response.text();
                const data = JSON.parse(responseText);

                if (data.success) {
                    const userData = { email: data.email, username: data.username };
                    sessionStorage.setItem('ailabsSession', JSON.stringify(userData));
                    showMainApp(userData);
                } else {
                    errorMsg.textContent = data.message || "Akses ditolak oleh database.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "Gagal terhubung ke database. Cek deploy Google Script (Anyone).";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-fingerprint"></i> Authenticate';
            }
        }

        function showMainApp(user) {
            document.getElementById('login-view').classList.add('hidden');
            const mainApp = document.getElementById('main-app');
            mainApp.classList.remove('hidden');
            setTimeout(() => mainApp.classList.add('open'), 100);
            
            document.getElementById('user-name-display').textContent = user.username || "Ailabs User";
            document.getElementById('user-email-display').textContent = user.email;
            
            loadApps();
        }

        function handleLogout() {
            sessionStorage.removeItem('ailabsSession');
            location.reload();
        }

        async function loadApps() {
            // 1. Ambil Cache Lokal (Menggunakan kunci baru v5 agar mengabaikan cache rusak lama)
            const savedApps = localStorage.getItem('ailabs_v5_apps');
            if (savedApps) {
                allApps = JSON.parse(savedApps);
            }
            
            updateCounts();
            if(document.getElementById('sub-panel-wrapper').classList.contains('active')) renderApps(currentCategory);

            // 2. Tarik Data dari Cloud & Gabungkan Otomatis
            if (APPS_DB_URL !== "") {
                const syncBtn = document.getElementById('sync-btn');
                if(syncBtn) syncBtn.classList.add('fa-spin');
                
                try {
                    const response = await fetch(APPS_DB_URL + "?action=getApps");
                    const textData = await response.text();
                    
                    if (!textData.trim().startsWith('<')) {
                        const data = JSON.parse(textData);
                        if (data.success) {
                            let cloudApps = data.apps || [];
                            let needCloudUpdate = false;

                            // LOGIKA PINTAR: Cek apakah ke-27 aplikasi ini sudah ada di Spreadsheet
                            DEFAULT_APPS.forEach(defApp => {
                                // Cari berdasarkan URL, abaikan format huruf besar/kecil
                                const exists = cloudApps.some(ca => (ca.url || ca.u || "").toLowerCase() === defApp.url.toLowerCase());
                                if (!exists) {
                                    cloudApps.push(defApp); // Masukkan ke dalam daftar
                                    needCloudUpdate = true; // Tandai bahwa Spreadsheet harus diupdate!
                                }
                            });

                            allApps = cloudApps;
                            localStorage.setItem('ailabs_v5_apps', JSON.stringify(allApps));
                            updateCounts();
                            if(document.getElementById('sub-panel-wrapper').classList.contains('active')) renderApps(currentCategory);

                            // Jika ternyata di Spreadsheet datanya kurang dari 27, script otomatis simpan sisanya!
                            if (needCloudUpdate) {
                                console.log("Mensinkronkan 27 aplikasi utama ke Spreadsheet...");
                                saveApps();
                            }
                        }
                    }
                } catch (err) { console.warn("Info Cloud:", err.message); }
                finally { if(syncBtn) syncBtn.classList.remove('fa-spin'); }
            }
        }

        async function forceSync() {
            // Hapus cache agar ditarik ulang secara bersih
            localStorage.removeItem('ailabs_v5_apps');
            const syncBtn = document.getElementById('sync-btn');
            if(syncBtn) syncBtn.style.color = "#2cf95f"; 
            
            await loadApps();
            
            setTimeout(() => { if(syncBtn) syncBtn.style.color = ""; }, 1000); 
        }

        async function saveApps() {
            updateCounts();
            renderApps(currentCategory);
            localStorage.setItem('ailabs_v5_apps', JSON.stringify(allApps));

            if (APPS_DB_URL !== "") {
                const addBtn = document.getElementById('btn-save-app');
                if(addBtn) addBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
                
                try {
                    await fetch(APPS_DB_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'saveApps', data: allApps }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                } catch (err) { console.error("Cloud Save Err:", err); }
                finally { if(addBtn) addBtn.innerHTML = 'Save App'; }
            }
        }

        function updateCounts() {
            // Render ulang seluruh UI Kategori agar kategori baru otomatis muncul
            renderCategoriesUI(); 
        }

        function renderCategoriesUI() {
            // 1. Tarik semua kategori dan urutkan
            let uniqueCats = []; 
            
            // Masukkan kategori utama sesuai urutan yang Anda atur di CATEGORY_ORDER
            CATEGORY_ORDER.forEach(cat => uniqueCats.push(cat));

            // Deteksi kategori baru dari database dan taruh di bawahnya
            allApps.forEach(a => {
                if(a.category && a.category.trim() !== '') {
                    const catName = a.category.toLowerCase().trim();
                    if(!uniqueCats.includes(catName)) {
                        uniqueCats.push(catName);
                    }
                }
            });

            const miniMenu = document.querySelector('.mini-menu');
            const categoryMenu = document.getElementById('category-menu');
            
            // UBAH BAGIAN INI: Targetkan ke datalist 'category-list'
            const appCategoryList = document.getElementById('category-list');

            if(!miniMenu || !categoryMenu || !appCategoryList) return;

            miniMenu.innerHTML = '';
            categoryMenu.innerHTML = '';
            appCategoryList.innerHTML = '';

            uniqueCats.forEach(cat => {
                const info = getCategoryInfo(cat);
                const count = allApps.filter(a => (a.category || 'apps').toLowerCase().trim() === cat).length;
                const isActive = (cat === currentCategory);

                // Buat icon sidebar
                miniMenu.innerHTML += `<li class="${isActive ? 'active' : ''}" onclick="changeCategory('${cat}', '${info.title}')" title="${info.title}"><i class="fa-solid ${info.icon}"></i></li>`;

                // Buat menu panel utama
                categoryMenu.innerHTML += `
                    <li class="${isActive ? 'current' : ''}" onclick="changeCategory('${cat}', '${info.title}')">
                        <div><i class="fa-solid ${info.icon}"></i><span>${info.title}</span></div>
                        <span class="menu-badge">${count}</span>
                    </li>
                `;

                // Buat pilihan dropdown di form Admin
                appCategoryList.innerHTML += `<option value="${cat}">${info.title}</option>`;
            });

            // Kembalikan link eksternal manual (AI-Labs By Pro) di paling bawah
            categoryMenu.innerHTML += `
                <li onclick="smartOpen(event, 'https://ai-labs-by-pro.vercel.app/')">
                    <div><i class="fa-solid fa-globe"></i><span>AI-Labs By Pro</span></div>
                    <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 14px; opacity: 0.5;"></i>
                </li>
            `;
        }

        function getAppIcon(title) {
            const t = String(title || "").toLowerCase();
            if (t.includes('audio') || t.includes('voice') || t.includes('music')) return 'fa-music';
            if (t.includes('image') || t.includes('flux') || t.includes('morp') || t.includes('cartoon') || t.includes('cover')) return 'fa-image';
            if (t.includes('video') || t.includes('scene') || t.includes('storyboard') || t.includes('reels') || t.includes('capcut')) return 'fa-film';
            if (t.includes('umkm') || t.includes('affiliate')) return 'fa-chart-line';
            if (t.includes('dna')) return 'fa-dna';
            if (t.includes('speed')) return 'fa-gauge-high';
            if (t.includes('template')) return 'fa-table-list';
            return 'fa-rocket';
        }

        function renderApps(categoryKey) {
            const container = document.getElementById('app-list');
            container.innerHTML = '';
            
            const filteredApps = allApps.filter(a => {
                let cat = (a.category || 'apps').toLowerCase().trim();
                return cat === categoryKey;
            });

            if (filteredApps.length === 0) {
                container.innerHTML = '<p style="color:white;text-align:center;font-size:12px;opacity:0.6;margin-top:20px;">Belum ada aplikasi.</p>';
                return;
            }

            let html = '';
            filteredApps.forEach(app => {
                // Gunakan app.name, atau fallback ke app.t (format data lama), atau teks default
                const appName = app.name || app.t || "Unknown App";
                // Gunakan app.url, atau fallback ke app.u (format data lama)
                const appUrl = app.url || app.u || "#";

                const iconContent = app.logo 
                    ? `<img src="${app.logo}" style="width:100%;height:100%;object-fit:cover;" onerror="this.outerHTML='<i class=\\'fa-solid ${getAppIcon(appName)}\\'></i>'">` 
                    : `<i class="fa-solid ${getAppIcon(appName)}"></i>`;
                
                let adminControls = '';
                if(isAdmin) {
                    adminControls = `
                        <div class="admin-controls">
                            <button class="admin-btn btn-edit" onclick="event.preventDefault(); event.stopPropagation(); openEditModal('${app.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="admin-btn btn-delete" onclick="event.preventDefault(); event.stopPropagation(); deleteApp('${app.id}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                html += `
                    <a href="${appUrl}" onclick="smartOpen(event, this.href)" class="app-item">
                        <div class="app-icon">${iconContent}</div>
                        <div class="app-details">
                            <h4>${appName}</h4>
                            <p>${appUrl.replace(/^https?:\/\//, '').substring(0, 30)}...</p>
                        </div>
                        ${adminControls}
                        <i class="fa-solid fa-arrow-up-right-from-square link-icon" ${isAdmin ? 'style="display:none"' : ''}></i>
                    </a>
                `;
            });
            container.innerHTML = html;
        }

        window.changeCategory = function(categoryKey, title) {
            currentCategory = categoryKey;
            renderCategoriesUI(); // Update UI status aktif
            
            document.getElementById('sub-panel-title').innerText = title || getCategoryInfo(categoryKey).title;
            renderApps(categoryKey);
            document.getElementById('sub-panel-wrapper').classList.add('active');
        };

        window.closeSubPanel = function() {
            document.getElementById('sub-panel-wrapper').classList.remove('active');
            renderCategoriesUI(); // Reset UI status aktif
        };

        function handleLogoClick() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                document.getElementById('password-modal').classList.add('active');
                document.getElementById('admin-password').value = '';
                document.getElementById('password-error').classList.add('hidden');
                document.getElementById('admin-password').focus();
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => clickCount = 0, 1000);
            }
        }

        function closePasswordModal() { document.getElementById('password-modal').classList.remove('active'); }

        function verifyPassword() {
            const pwd = document.getElementById('admin-password').value;
            if (pwd === '@Kr333wol') {
                isAdmin = true;
                closePasswordModal();
                document.getElementById('admin-add-btn').classList.remove('hidden');
                document.getElementById('admin-bulk-btn').classList.remove('hidden');
                if(document.getElementById('sub-panel-wrapper').classList.contains('active')) renderApps(currentCategory);
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
            document.getElementById('add-app-form').reset();
            document.getElementById('edit-app-id').value = '';
            document.getElementById('modal-title').textContent = 'Add Interface';
            document.getElementById('app-category').value = currentCategory;
            document.getElementById('app-name').focus();
        }

        window.openEditModal = function(id) {
            const app = allApps.find(a => a.id === id);
            if(app) {
                document.getElementById('add-modal').classList.add('active');
                document.getElementById('edit-app-id').value = app.id;
                document.getElementById('app-name').value = app.name;
                document.getElementById('app-url').value = app.url;
                document.getElementById('app-category').value = app.category || 'apps';
                document.getElementById('app-logo').value = app.logo || '';
                document.getElementById('modal-title').textContent = 'Edit Interface';
            }
        };

        function closeAddModal() { document.getElementById('add-modal').classList.remove('active'); }

        window.handleAddApp = function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-app-id').value;
            const name = document.getElementById('app-name').value;
            const url = document.getElementById('app-url').value;
            const category = document.getElementById('app-category').value;
            const logo = document.getElementById('app-logo').value;

            if (id) {
                const index = allApps.findIndex(a => a.id === id);
                if(index !== -1) allApps[index] = { ...allApps[index], name, url, logo, category };
            } else {
                allApps.push({ id: 'app_' + Date.now(), name, url, logo, category });
            }
            saveApps();
            closeAddModal();
        };

        window.deleteApp = function(id) {
            if(confirm("Hapus aplikasi ini?")) {
                allApps = allApps.filter(app => app.id !== id);
                saveApps();
            }
        };

        window.openBulkModal = function() {
            document.getElementById('bulk-modal').classList.add('active');
            document.getElementById('bulk-textarea').value = '';
            document.getElementById('bulk-status').textContent = '';
            document.getElementById('bulk-status').className = '';
        };

        window.closeBulkModal = function() {
            document.getElementById('bulk-modal').classList.remove('active');
        };

        window.processBulkImport = function() {
            const textarea = document.getElementById('bulk-textarea');
            const statusText = document.getElementById('bulk-status');
            const rawData = textarea.value.trim();

            if (!rawData) {
                statusText.textContent = "Data kosong!";
                statusText.className = "text-error";
                return;
            }

            let newData = [];
            try {
                newData = JSON.parse(rawData);
                if (!Array.isArray(newData)) {
                    throw new Error("Data harus berupa array JSON: [...]");
                }
            } catch (err) {
                statusText.textContent = "Format JSON tidak valid: " + err.message;
                statusText.className = "text-error";
                return;
            }

            let addedCount = 0;
            let skipCount = 0;

            newData.forEach(app => {
                if (!app.name || !app.url) return; // Skip invalid entries

                // Pengecekan Duplikat berdasarkan URL
                const isDuplicate = allApps.some(existingApp => 
                    existingApp.url.toLowerCase() === app.url.toLowerCase()
                );

                if (!isDuplicate) {
                    allApps.push({
                        id: app.id || ('app_' + Date.now() + Math.floor(Math.random() * 1000)),
                        name: app.name,
                        url: app.url,
                        category: app.category || 'apps',
                        logo: app.logo || ''
                    });
                    addedCount++;
                } else {
                    skipCount++;
                }
            });

            if (addedCount > 0) {
                saveApps(); // This will save to localStorage and trigger cloud sync
                statusText.textContent = `Berhasil menambah ${addedCount} aplikasi. (${skipCount} duplikat dilewati). Menunggu sinkronisasi...`;
                statusText.className = "text-success";
                setTimeout(closeBulkModal, 3000);
            } else {
                statusText.textContent = `Tidak ada aplikasi baru ditambahkan. (${skipCount} duplikat ditemukan).`;
                statusText.className = "text-warning";
                statusText.style.color = "#ffd93d";
            }
        };

        // Smart Open Link Handler
        window.smartOpen = function(e, url) {
            if(e) e.preventDefault();
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isWebView = /(Instagram|FBAN|FBAV|WhatsApp|Line|TikTok|wv)/i.test(ua);
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            try {
                if (isWebView || isStandalone) window.location.href = url;
                else {
                    let newWin = window.open(url, '_blank', 'noopener,noreferrer');
                    if (!newWin || newWin.closed) window.location.href = url;
                }
            } catch (err) { window.location.href = url; }
        };

        // Init
        window.addEventListener('DOMContentLoaded', () => { initAuth(); });
    </script>
</body>
</html>
